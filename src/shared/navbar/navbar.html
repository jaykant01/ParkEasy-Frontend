<nav class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-1 text-xl font-bold text-blue-600">
        <mat-icon class="text-blue-600">local_parking</mat-icon>
        ParkEasy
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden sm:flex items-center space-x-4" *ngIf="isLoggedIn">
        <a routerLink="/home" routerLinkActive="active" class="nav-link">Dashboard</a>
        <a routerLink="/your-spaces" routerLinkActive="active" class="nav-link">Your Spaces</a>

        <!-- Profile Popup Trigger -->
        <button (click)="openProfilePopup()"
                class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-200 hover:bg-gray-300">
          <mat-icon>person</mat-icon>
        </button>

        <!-- Logout Red Button -->
        <button (click)="logout()" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-md">
          Logout
        </button>
      </div>

      <!-- Desktop (Logged Out) -->
      <div class="hidden sm:flex items-center space-x-2" *ngIf="!isLoggedIn">
        <button routerLink="/login"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md">
          Login
        </button>

        <button routerLink="/signup"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md">
          Sign Up
        </button>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="sm:hidden" (click)="toggleMenu()">
        <mat-icon class="text-3xl">{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>

    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="sm:hidden" [class.hidden]="!isMenuOpen">

    <div class="px-4 pb-4 pt-2 space-y-3">

      <!-- Logged In Items -->
      <ng-container *ngIf="isLoggedIn">

        <a routerLink="/home"
           class="block w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
           (click)="toggleMenu()">
          Dashboard
        </a>

        <a routerLink="/your-spaces"
           class="block w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700"
           (click)="toggleMenu()">
          Your Spaces
        </a>

        <button (click)="openProfilePopup()"
                class="flex items-center gap-2 px-4 py-2 w-full bg-gray-200 rounded-md hover:bg-gray-300">
          <div class="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center">
            <mat-icon>person</mat-icon>
          </div>
          <span class="font-medium text-gray-700">Profile</span>
        </button>

        <button (click)="logout()"
                class="block w-full px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-md">
          Logout
        </button>

      </ng-container>

      <!-- Logged Out Items -->
      <ng-container *ngIf="!isLoggedIn">
        <button routerLink="/login"
                class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
          Login
        </button>

        <button routerLink="/signup"
                class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
          Sign Up
        </button>
      </ng-container>

    </div>
  </div>
</nav>
