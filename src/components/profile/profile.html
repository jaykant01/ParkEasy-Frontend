<div class="p-6 bg-white rounded-xl shadow-xl w-full text-center">
  <div class="mx-auto w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-4xl">
    <mat-icon class="text-5xl">person</mat-icon>
  </div>

  <h2 class="text-xl font-semibold mt-4">{{ data.name }}</h2>
  <p class="text-gray-600">{{ data.email }}</p>

  <div class="mt-3 text-sm text-blue-600 font-medium">
    Role: {{ data.role }}
  </div>

  <button mat-button mat-dialog-close
          class="mt-6 w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
    Close
  </button>
</div>
